<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audience View</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: Georgia, serif; background: #111; color: #eee; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
    #slide { background: #fff; color: #111; padding: 60px 80px; border-radius: 8px; max-width: 1100px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    #slide h1 { font-size: 2.4em; margin-top: 0; border-bottom: 3px solid #4a7; padding-bottom: 12px; }
    #slide li { font-size: 1.3em; line-height: 1.6; margin: 12px 0; }
  </style>
</head>
<body>
  <div id="slide">Waiting for presenter...</div>
  <script>
    async function poll() {
      try {
        const res = await fetch("/latest");
        const data = await res.json();
        if (data.markdown) {
          document.getElementById("slide").innerHTML = marked.parse(data.markdown);
        }
      } catch (e) {}
      setTimeout(poll, 1000);
    }
    poll();
  </script>
</body>
</html>
